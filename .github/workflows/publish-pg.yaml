name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    paths:
      - "postgres-cnpg/**"
      - "postgres/**"
      - ".github/workflows/publish-pg.yaml"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to tag the image with (e.g., 18.3) - should match Postgres version"
        required: true
        type: string
      target:
        description: "Which image to build (standard, cnpg, or all)"
        required: true
        type: choice
        options:
          - all
          - cnpg
          - standard
        default: all

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  REGISTRY_USERNAME: ${{ github.actor }}
  REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
  IMAGE_NAME: meteroid-postgres
  PGMQ_VERSION: 1.11.0

jobs:
  build:
    strategy:
      matrix:
        image:
          # From 18.4+: standalone image uses plain version tag (e.g. 18.4)
          # CNPG image uses -cnpg suffix (e.g. 18.4-cnpg)
          # Note: 18.3 and earlier used plain tags for CNPG (legacy, do not reuse)
          - context: postgres
            target: standard
            tag_suffix: "-standard"
          - context: postgres-cnpg
            target: cnpg
            tag_suffix: "-cnpg"
        platform:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64

    runs-on: ${{ matrix.platform.runner }}
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == matrix.image.target }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ env.REGISTRY_PASSWORD }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          flavor: |
            suffix=${{ matrix.image.tag_suffix }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'workflow_dispatch' }}
            type=sha,format=short,prefix=
            type=raw,value=${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image.context }}
          platforms: linux/${{ matrix.platform.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: PGMQ_VERSION=${{ env.PGMQ_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=image,name=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests/${{ matrix.image.target }}
          digest="${{ steps.build.outputs.digest }}"
          echo "$digest" > "/tmp/digests/${{ matrix.image.target }}/${{ matrix.platform.arch }}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.image.target }}-${{ matrix.platform.arch }}
          path: /tmp/digests/${{ matrix.image.target }}/${{ matrix.platform.arch }}
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - target: standard
            tag_suffix: "-standard"
          - target: cnpg
            tag_suffix: "-cnpg"
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == matrix.image.target }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.image.target }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ env.REGISTRY_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          flavor: |
            suffix=${{ matrix.image.tag_suffix }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'workflow_dispatch' }}
            type=sha,format=short,prefix=
            type=raw,value=${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          TAGS="${{ steps.meta.outputs.tags }}"
          TAGS_ARGS=""
          for tag in $TAGS; do
            TAGS_ARGS="$TAGS_ARGS -t $tag"
          done

          DIGESTS=""
          for digest_file in *; do
            DIGESTS="$DIGESTS ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}@$(cat $digest_file)"
          done

          docker buildx imagetools create $TAGS_ARGS $DIGESTS
